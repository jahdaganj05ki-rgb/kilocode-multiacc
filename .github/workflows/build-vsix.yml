# kilocode_change - new file
name: build-vsix
run-name: Build VS Code extension (VSIX)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Comma-separated targets to build (default: linux-x64, win32-x64)"
        required: false
        type: string
        default: ""

concurrency: build-vsix-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Codespaces laufen auf Linux -> brauchen linux-x64.
          - os: ubuntu-latest
            target: linux-x64
            vsix: kilo-vscode-linux-x64
          # Windows-Desktop braucht win32-x64.
          - os: windows-latest
            target: win32-x64
            vsix: kilo-vscode-win32-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun # kilocode_change

      # Zig für den Linux-Bubblewrap-Helfer (nur auf Linux-Runner nötig,
      # siehe packages/opencode/script/kilocode/bubblewrap.ts).
      # Gleicher Download wie in der bestehenden publish.yml.
      - name: Setup Zig for Linux sandbox helpers
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      # Baut die CLI-Binärdatei für die aktuelle Runner-Plattform
      # (bin/kilo auf Linux, bin/kilo.exe auf Windows) plus Tree-Sitter-,
      # Sandbox-, bwrap- und FFmpeg-Ressourcen. Ohne bin/kilo kann der
      # Kilo Agent in der Extension nicht laufen.
      - name: Build CLI binary for current platform
        working-directory: ./packages/kilo-vscode
        run: bun run prepare:cli-binary

      # Generiert den TypeScript SDK-Client aus den Server-Endpunkten.
      - name: Build SDK client
        working-directory: ./packages/kilo-vscode
        run: bun run prepare:sdk

      # Bundled die Extension production-ready nach dist/ (esbuild).
      - name: Bundle extension (production)
        working-directory: ./packages/kilo-vscode
        run: bun run bundle:production

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce # kilocode_change

      # Packt dist/ + bin/ (per .vscodeinclude eingeschlossen) in ein installierbares .vsix.
      # --no-dependencies: alle Abhängigkeiten sind bereits gebundelt.
      # --skip-license: LICENSE-Prüfung überspringen.
      - name: Package .vsix
        working-directory: ./packages/kilo-vscode
        env:
          npm_config_ignore_scripts: "true"
        run: vsce package --no-dependencies --skip-license --target ${{ matrix.target }} -o ${{ matrix.vsix }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4 # kilocode_change
        with:
          name: ${{ matrix.vsix }}
          path: ./packages/kilo-vscode/${{ matrix.vsix }}.vsix
          if-no-files-found: error
          retention-days: 30